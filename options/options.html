<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n="op_page_title">Postframe · Settings</title>
<link rel="stylesheet" href="options.css">
</head>
<body>
<header class="o-top">
  <div><h1>Postframe</h1><p data-i18n="op_subtitle"></p></div>
  <div class="o-top-right">
    <label class="o-inline"><span data-i18n="op_language"></span>
      <select id="lang"></select>
    </label>
    <nav class="o-tabs" id="tabs">
      <button data-tab="styles" aria-pressed="true" data-i18n="op_tab_styles"></button>
      <button data-tab="platforms" aria-pressed="false" data-i18n="op_tab_platforms"></button>
    </nav>
  </div>
</header>

<div class="o-layout" id="tab-styles">
  <aside class="o-side">
    <label class="o-label"><span data-i18n="op_platform_label"></span>
      <select id="filter"></select>
    </label>
    <ul id="list" class="o-list"></ul>
    <div class="o-side-actions">
      <button id="new" class="o-primary" data-i18n="op_new_style"></button>
      <div class="o-row">
        <button id="export" data-i18n="op_export"></button>
        <button id="import" data-i18n="op_import"></button>
        <input id="file" type="file" accept="application/json,.json" hidden>
      </div>
    </div>
  </aside>
  <section class="o-editor">
    <div class="o-bar">
      <input id="name" class="o-name" maxlength="40" data-i18n-aria="op_name_aria">
      <label class="o-inline"><span data-i18n="op_applies_to"></span>
        <select id="platsel"></select>
      </label>
      <button id="setdef"></button>
      <button id="del" class="o-danger" data-i18n="op_delete"></button>
    </div>
    <p id="ro" class="o-note" hidden data-i18n="op_readonly_style"></p>
    <div class="o-grid">
      <div class="o-formcol">
        <div class="o-foldbar">
          <button type="button" id="foldAll" data-i18n="op_fold_all"></button>
          <button type="button" id="unfoldAll" data-i18n="op_unfold_all"></button>
        </div>
        <form id="form" class="o-form" autocomplete="off"></form>
      </div>
      <div class="o-preview">
        <div class="o-seg" id="seg"></div>
        <div id="pvwrap"><style id="pvstyle"></style><div id="pv"></div></div>
        <p id="fontstatus" class="o-hint"></p>
        <p class="o-hint" data-i18n="op_preview_hint"></p>
      </div>
    </div>
  </section>
</div>

<div class="o-layout" id="tab-platforms" hidden>
  <aside class="o-side">
    <ul id="plist" class="o-list"></ul>
    <div class="o-side-actions"><button id="pnew" class="o-primary" data-i18n="op_new_platform"></button></div>
  </aside>
  <section class="o-editor">
    <p id="pro" class="o-note" hidden data-i18n="op_pro_note"></p>
    <form id="pform" class="o-form" autocomplete="off"></form>
    <button id="pdup" style="margin-top:14px" hidden data-i18n="op_dup_platform"></button>
    <button id="pdel" class="o-danger" style="margin-top:14px" data-i18n="op_del_platform"></button>
    <p class="o-hint" style="margin-top:14px" data-i18n="op_plat_tip"></p>
  </section>
</div>

<!-- First use: the language must be chosen before anything else. -->
<div id="welcome" class="o-welcome" hidden>
  <div class="o-welcome-card" role="dialog" aria-modal="true" aria-labelledby="welcome-title">
    <h2 id="welcome-title" data-i18n="op_welcome_title"></h2>
    <p data-i18n="op_welcome_hint"></p>
    <div id="welcome-list" class="o-welcome-list"></div>
  </div>
</div>
<script type="module" src="options.js"></script>
</body>
</html>
