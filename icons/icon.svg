<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Two hands reduced to their framing "L" (thumb + index finger), at opposite corners -->
  <rect width="128" height="128" rx="28" fill="#000"/>
  <g id="hand" fill="#fff">
    <rect x="24" y="24" width="56" height="18" rx="9"/>   <!-- index finger -->
    <rect x="24" y="24" width="18" height="56" rx="9"/>   <!-- thumb -->
  </g>
  <use href="#hand" transform="rotate(180 64 64)"/>
</svg>
