<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    
    <!-- Mão em "L": indicador ao longo do topo, polegar ao longo da lateral, dedos dobrados no canto externo -->
    <g id="hand" fill="#fff" stroke="#000" stroke-width="2.5" stroke-linejoin="round">
      <rect x="11" y="40" width="26" height="11" rx="5.5"/>           <!-- dedos dobrados -->
      <rect x="11" y="51" width="26" height="11" rx="5.5"/>
      <rect x="11" y="62" width="24" height="11" rx="5.5"/>
      <rect x="14" y="14" width="34" height="34" rx="13"/>            <!-- palma -->
      <rect x="22" y="20" width="56" height="17" rx="8.5"/>           <!-- indicador -->
      <rect x="22" y="20" width="17" height="44" rx="8.5"/>           <!-- polegar -->
    </g>
  </defs>
  <rect width="128" height="128" rx="28" fill="#000"/>
  <rect x="38" y="38" width="52" height="52" rx="3" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2.5" stroke-dasharray="5 5"/>
  <use href="#hand"/>
  <use href="#hand" transform="rotate(180 64 64)"/>
</svg>
